[build]
  command = "npm run build:netlify"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "cookie-parser", "googleapis", "firebase-admin", "jsonwebtoken", "bcryptjs", "multer", "serverless-http"]

# Route all /api/* calls to our single Express function (auth + drives routes)
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# SPA fallback so client-side routing (react-router) works on refresh/deep links
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
